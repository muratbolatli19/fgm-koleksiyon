<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yeni Şifre Belirle | FGM Koleksiyon</title><style>body{margin:0;background:#fff8ef;color:#432b1b;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(92vw,420px);background:white;padding:28px;border-radius:18px;box-shadow:0 8px 32px #97714524}h1{font-family:Georgia;color:#986515}input,button{box-sizing:border-box;width:100%;padding:15px;margin:8px 0;border-radius:9px;font:inherit}input{border:1px solid #d4bfa2}button{border:0;background:#b98312;color:white;font-weight:700}a{color:#92641c}#message{min-height:30px}</style></head><body><main><h1>FGM Koleksiyon</h1><h2>Yeni Şifre Belirle</h2><p>E-postanızdaki şifre yenileme bağlantısından bu sayfaya geldiyseniz yeni şifrenizi belirleyebilirsiniz.</p><form id="form"><label>Yeni şifre<input id="pw" type="password" minlength="8" autocomplete="new-password" required></label><label>Yeni şifre (tekrar)<input id="pw2" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Şifreyi Kaydet</button></form><p id="message" role="status">Bağlantı doğrulanıyor...</p><p><a href="/yonetim.html">Yönetici Girişine Dön</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://phaxjhtwkgnslksqyliw.supabase.co','sb_publishable_HNUG7N7rSdQtuD9ZutdOMg_ve-s5Sz8');const msg=document.getElementById('message');let ready=false;async function init(){try{const u=new URL(location.href);const code=u.searchParams.get('code');if(code){const r=await sb.auth.exchangeCodeForSession(code);if(r.error)throw r.error}const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('error'))throw Error(hash.get('error_description')||'Bağlantı geçersiz');const session=await sb.auth.getSession();if(session.data.session){ready=true;msg.textContent='Bağlantı doğrulandı. Yeni şifrenizi yazabilirsiniz.';history.replaceState(null,'',location.pathname)}else{msg.textContent='Geçerli oturum bulunamadı. Yönetici girişinden yeni şifre bağlantısı isteyin.'}}catch(e){msg.textContent='Bağlantı doğrulanamadı: '+e.message}}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session){ready=true;msg.textContent='Bağlantı doğrulandı. Yeni şifrenizi yazabilirsiniz.'}});init();document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(!ready){msg.textContent='Önce e-postanızdaki geçerli şifre yenileme bağlantısını açın.';return}const a=document.getElementById('pw').value,b=document.getElementById('pw2').value;if(a!==b){msg.textContent='Şifreler eşleşmiyor.';return}if(a.length<8){msg.textContent='Şifre en az 8 karakter olmalı.';return}msg.textContent='Kaydediliyor...';const r=await sb.auth.updateUser({password:a});if(r.error){msg.textContent=r.error.message;return}await sb.auth.signOut();msg.textContent='Şifreniz yenilendi. Artık yönetici girişinden giriş yapabilirsiniz.';document.getElementById('form').hidden=true})</script></body></html>
