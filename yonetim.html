<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FGM Koleksiyon Yönetim</title><link rel="manifest" href="/yonetim.webmanifest"><meta name="theme-color" content="#b98312"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FGM Yönetim"><link rel="apple-touch-icon" href="/yonetim-icon.svg"><style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap');:root{--gold:#bc851c;--ink:#4a3024}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#fff 0,#fff7ed 42%,#f6e5d5 100%);color:var(--ink);font:15px system-ui,sans-serif;min-height:100vh}.shell{max-width:720px;margin:auto;padding:14px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0 15px;border-bottom:1px solid #e9d8c3}.identity{display:flex;align-items:center;gap:13px}.brand{width:92px;height:92px;object-fit:contain;border-radius:50%;mix-blend-mode:multiply}.brand-title{font:700 clamp(20px,4.5vw,28px) 'Playfair Display',Georgia,serif;margin:0}.brand-sub{color:#9b783c;font-size:12px;letter-spacing:2px;margin-top:3px}.settings-toggle{border:1px solid #e5cfae;background:#fffaf4;color:#765127;border-radius:100px;width:45px;height:45px;font-size:22px;flex-shrink:0}h2{font:700 26px 'Playfair Display',Georgia,serif;margin:0 0 14px}.intro{font-size:13px;color:#9b7c5d;margin:13px 0 18px}.panel-card{background:#fffdf9;border:1px solid #efdfc9;border-radius:20px;box-shadow:0 8px 28px #7d503216;padding:20px;margin:20px 0}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{background:#f9ead1;color:#8a5e1d;border-radius:99px;padding:6px 10px;font-size:12px}.row{display:flex;align-items:center;gap:9px;border-bottom:1px solid #f0e7dc;padding:14px 0}.row span{flex:1;font-weight:600}.row button{width:auto;margin:0;padding:9px 13px;font-size:13px}.row button[data-delete]{background:#fff1ec;color:#a74434;border:1px solid #f0c8bd}.row:last-child{border:0}.hidden{display:none!important}label{display:block;font-size:14px;font-weight:600;margin:14px 0 5px}input,textarea,select{display:block;width:100%;border:1px solid #e3ceb4;background:#fff;border-radius:12px;padding:13px;margin:7px 0;font:inherit;color:var(--ink)}input[type=checkbox]{display:inline;width:auto}button{cursor:pointer;background:linear-gradient(120deg,#d7a52f,#aa7413);border:0;border-radius:12px;color:#fff;padding:13px 16px;font:600 14px system-ui;width:100%;margin:10px 0}.subtle{background:#fff8ee;color:#7e5425;border:1px solid #e4ca9f}.settings-card{border:1px solid #ead6b7;background:#fffaf1;border-radius:16px;padding:16px;margin-top:12px}.settings-card button{margin:6px 0}.product-add{font-size:16px;padding:17px}.status{font-size:14px;color:#8b6227}.login-card{margin:28px auto;max-width:460px}.login-logo{display:block;width:130px;height:130px;object-fit:contain;margin:0 auto 10px;mix-blend-mode:multiply}@media(max-width:480px){.shell{padding:10px 13px 50px}.panel-card{padding:16px}.brand{width:76px;height:76px}.row{flex-wrap:wrap}.row span{flex-basis:100%}}</style></head><body><div class="shell"><header class="top"><div class="identity"><img class="brand" src="https://raw.githubusercontent.com/muratbolatli19/fgm-koleksiyon/b57ef45799501eff7ca2776ca14f5bceeec88a7d/fgm-logo.jpg" alt="FGM Koleksiyon logosu"><div><h1 class="brand-title">FGM Koleksiyon</h1><div class="brand-sub">YÖNETİM PANELİ</div></div></div><button class="settings-toggle hidden" id="settingsToggle" type="button" aria-label="Ayarlar" aria-expanded="false">⚙</button></header><section id="login" class="panel-card login-card"><img class="login-logo" src="https://raw.githubusercontent.com/muratbolatli19/fgm-koleksiyon/b57ef45799501eff7ca2776ca14f5bceeec88a7d/fgm-logo.jpg" alt="FGM Koleksiyon"><h2>Yönetici Girişi</h2><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="signIn">Giriş Yap</button><button id="forgot" type="button" style="background:transparent;color:#855e25;border:1px solid #b98312">Şifremi Unuttum / Yeni Şifre Oluştur</button><p id="message" role="status"></p></section><section id="panel" class="hidden"><p class="intro">Ürünlerinizi buradan kolayca yönetin ve koleksiyonunuza yeni ürünler ekleyin.</p><div class="settings-card hidden" id="settingsPanel"><h2>Ayarlar</h2><label>WhatsApp numarası (90 ile başlayacak)<input id="phone" inputmode="tel"></label><button id="savePhone">Numarayı Kaydet</button><button id="logout" class="subtle">Çıkış Yap</button></div><div class="panel-card"><div class="section-heading"><h2>Ürünler</h2><span class="count" id="productCount">0 ürün</span></div><div id="items"></div><button id="new" class="product-add">＋ Yeni Ürün Ekle</button></div><form id="form" class="panel-card hidden"><h2>Ürün Bilgileri</h2><label>Ürün adı<input id="name" required></label><label>Kategori<select id="category" required><option value="">Kategori seçiniz</option><option value="Nişan Hediyelikleri">Nişan Hediyelikleri</option><option value="Düğün Hediyelikleri">Düğün Hediyelikleri</option><option value="Mevlit Hediyelikleri">Mevlit Hediyelikleri</option><option value="Hac – Umre Hediyelikleri">Hac – Umre Hediyelikleri</option><option value="Baby Shower Hediyeleri">Baby Shower Hediyeleri</option><option value="Söz Hediyelikleri">Söz Hediyelikleri</option><option value="Öğretmen Hediyeleri">Öğretmen Hediyeleri</option><option value="Öğrenci Hediyeleri">Öğrenci Hediyeleri</option><option value="Ayraç">Ayraç</option><option value="Taş Tozu">Taş Tozu</option></select></label><label>Açıklama<textarea id="description"></textarea></label><label>Fotoğraflar (en fazla 10, 4 MB)<input id="photos" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><label><input id="active" type="checkbox" checked style="width:auto;display:inline"> Yayında</label><button type="submit">Kaydet</button></form><p id="status" class="status"></p></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js?v=16"></script></body></html>
