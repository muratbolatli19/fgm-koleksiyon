<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FGM Koleksiyon Yönetim</title><style>body{font:16px system-ui;max-width:650px;margin:30px auto;padding:20px;background:#fff9f2;color:#43291a}input,textarea,button{display:block;width:100%;padding:12px;margin:10px 0}button{background:#b98312;color:white;border:0;border-radius:9px}label{display:block;margin-top:12px}.hidden{display:none}.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding:10px 0}.row button{width:auto}img{max-width:80px}</style></head><body><h1>FGM Koleksiyon Yönetim</h1><section id="login"><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="signIn">Giriş Yap</button><button id="forgot" type="button" style="background:transparent;color:#855e25;border:1px solid #b98312">Şifremi Unuttum / Yeni Şifre Oluştur</button><p id="message" role="status"></p></section><section id="panel" class="hidden"><button id="logout">Çıkış Yap</button><label>WhatsApp numarası (90 ile başlayacak)<input id="phone"></label><button id="savePhone">Numarayı Kaydet</button><h2>Ürünler</h2><div id="items"></div><button id="new">Yeni Ürün Ekle</button><form id="form" class="hidden"><label>Ürün adı<input id="name" required></label><label>Kategori<input id="category" required></label><label>Açıklama<textarea id="description"></textarea></label><label>Fotoğraflar (en fazla 10, 4 MB)<input id="photos" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><label><input id="active" type="checkbox" checked style="width:auto;display:inline"> Yayında</label><button type="submit">Kaydet</button></form><p id="status"></p></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js?v=14"></script></body></html>
