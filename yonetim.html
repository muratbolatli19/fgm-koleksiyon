<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FGM Koleksiyon Yönetim</title><link rel="manifest" href="/yonetim.webmanifest"><meta name="theme-color" content="#b98312"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FGM Yönetim"><link rel="apple-touch-icon" href="/yonetim-icon.svg"><style>body{font:16px system-ui;max-width:650px;margin:30px auto;padding:20px;background:#fff9f2;color:#43291a}input,textarea,select,button{display:block;width:100%;padding:12px;margin:10px 0}button{background:#b98312;color:white;border:0;border-radius:9px}label{display:block;margin-top:12px}.hidden{display:none}.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #ddd;padding:10px 0}.row button{width:auto}img{max-width:80px}</style></head><body><h1>FGM Koleksiyon Yönetim</h1><p style="font-size:13px;color:#876d54">iPhone’da uygulama olarak eklemek için Safari’de Paylaş → Ana Ekrana Ekle seçeneğini kullanın.</p><section id="login"><input id="email" type="email" placeholder="E-posta"><input id="password" type="password" placeholder="Şifre"><button id="signIn">Giriş Yap</button><button id="forgot" type="button" style="background:transparent;color:#855e25;border:1px solid #b98312">Şifremi Unuttum / Yeni Şifre Oluştur</button><p id="message" role="status"></p></section><section id="panel" class="hidden"><button id="logout">Çıkış Yap</button><label>WhatsApp numarası (90 ile başlayacak)<input id="phone"></label><button id="savePhone">Numarayı Kaydet</button><h2>Ürünler</h2><div id="items"></div><button id="new">Yeni Ürün Ekle</button><form id="form" class="hidden"><label>Ürün adı<input id="name" required></label><label>Kategori<select id="category" required><option value="">Kategori seçiniz</option><option value="Nişan Hediyelikleri">Nişan Hediyelikleri</option><option value="Düğün Hediyelikleri">Düğün Hediyelikleri</option><option value="Mevlit Hediyelikleri">Mevlit Hediyelikleri</option><option value="Hac – Umre Hediyelikleri">Hac – Umre Hediyelikleri</option><option value="Baby Shower Hediyeleri">Baby Shower Hediyeleri</option><option value="Söz Hediyelikleri">Söz Hediyelikleri</option><option value="Öğretmen Hediyeleri">Öğretmen Hediyeleri</option><option value="Öğrenci Hediyeleri">Öğrenci Hediyeleri</option><option value="Ayraç">Ayraç</option><option value="Taş Tozu">Taş Tozu</option></select></label><label>Açıklama<textarea id="description"></textarea></label><label>Fotoğraflar (en fazla 10, 4 MB)<input id="photos" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><label><input id="active" type="checkbox" checked style="width:auto;display:inline"> Yayında</label><button type="submit">Kaydet</button></form><p id="status"></p></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/admin.js?v=15"></script></body></html>
